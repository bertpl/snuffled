[project]
name = "snuffled"
version = "0.1.8"
description = "Systematic Numerical Univariate Full-Function anaLysis for Establishing Difficulty of root-finding"
# readme is dynamic: hatch-fancy-pypi-readme builds the PyPI long-description from README.md,
# rewriting the relative splash link to a tag-pinned absolute URL (config below).
dynamic = ["readme"]
authors = [
    { name = "Bert Pluymers", email = "bert.pluymers@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    # Per-Python numpy floors on a numpy 2.0 baseline: each is the earliest 2.x shipping a wheel
    # for that CPython, so `lowest-direct` installs (not source-builds) across the whole matrix.
    "numpy>=2.0.0; python_version < '3.13'",
    "numpy>=2.1.0; python_version == '3.13'",
    "numpy>=2.3.2; python_version >= '3.14'",
    # Per-Python numba floors: earliest numba with a wheel for that CPython (so `lowest-direct`
    # installs a wheel, and numba is available on the newest CPython in the matrix).
    "numba>=0.57; python_version < '3.12'",
    "numba>=0.59; python_version == '3.12'",
    "numba>=0.61; python_version == '3.13'",
    "numba>=0.63; python_version >= '3.14'",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    # Python versions kept in sync with .python-versions (release.py enforces this)
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Typing :: Typed",
]

[dependency-groups]
dev = [
    "genbadge[all]>=1.1.2",
    "hypothesis>=6.100",
    "jupyterlab>=4.4.6",
    "matplotlib>=3.10.5",
    "notebook>=7.4.5",
    "pre-commit>=4.0",
    "pytest>=8.0",
    "pytest-cov>=6.0",
    "pytest-xdist>=3.5.0",
    # exact tool versions are pinned by the tracked uv.lock (used by pre-commit,
    # `make lint`, and CI); these ranges just set the floor.
    "ruff>=0.15.11",
    "ty==0.0.56",  # pre-1.0 type checker — pin exactly; its ruleset is still evolving
]

[project.urls]
Source = "https://github.com/bertpl/snuffled"
ChangeLog = "https://github.com/bertpl/snuffled/blob/main/CHANGELOG.md"
Issues = "https://github.com/bertpl/snuffled/issues"
Roadmap = "https://github.com/bertpl/snuffled/milestones"


[build-system]
requires = ["hatchling", "hatch-fancy-pypi-readme"]
build-backend = "hatchling.build"

[tool.hatch.metadata.hooks.fancy-pypi-readme]
content-type = "text/markdown"

[[tool.hatch.metadata.hooks.fancy-pypi-readme.fragments]]
path = "README.md"

[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
# splash image: relative link -> tag-pinned raw URL so each release's PyPI page
# renders that release's stamped splash, not whatever main's is at view time.
pattern = '\]\((images/[^)]+)\)'
replacement = '](https://raw.githubusercontent.com/bertpl/snuffled/v$HFPR_VERSION/\1)'

[tool.hatch.build.targets.sdist]
packages = ["snuffled"]

[tool.hatch.build.targets.wheel]
packages = ["snuffled"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
# Broad rule set; PLC/PLR (pylint conventions/refactors) are deliberately excluded as
# noisy on this numerical domain, and specific carve-outs live in `ignore` below.
select = [
    "F",       # pyflakes
    "E", "W",  # pycodestyle (incl. E501 line-too-long)
    "I",       # isort
    "UP",      # pyupgrade
    "C4",      # flake8-comprehensions
    "PIE",     # flake8-pie
    "SIM",     # flake8-simplify
    "RET",     # flake8-return
    "PTH",     # flake8-use-pathlib
    "TC",      # flake8-type-checking
    "RUF",     # ruff-native
    "PLE", "PLW",  # pylint errors + warnings (PLC/PLR excluded — noisy on this domain)
    "PGH",     # pygrep-hooks: no blanket `noqa` / `type: ignore`
    "BLE",     # flake8-blind-except
    "A",       # flake8-builtins: shadowing
    "RSE",     # flake8-raise: no needless parens on `raise`
    "FLY",     # flynt: static str-join → f-string
    "INP",     # flake8-no-pep420: every package dir has an __init__.py
    "D",       # pydocstyle (Google convention)
    "B",       # flake8-bugbear
    "N",       # pep8-naming
    "PT",      # flake8-pytest-style
    "ANN",     # flake8-annotations
    "SLF",     # flake8-self: private-member access
    "S",       # flake8-bandit: security lint
    "C901",    # mccabe complexity gate (threshold in [tool.ruff.lint.mccabe])
]
ignore = [
    "RUF001", "RUF002", "RUF003",  # intentional typography, not "ambiguous"
    "RUF007",  # numba nopython mode can't compile itertools.pairwise; keep zip(x[:-1], x[1:])
    "B905",    # numba nopython mode can't take zip()'s strict= kwarg
]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.flake8-pytest-style]
parametrize-names-type = "csv"                     # names given as a single "a, b" string
raises-require-match-for = ["Exception", "BaseException"]  # only the truly broad base exceptions need match=

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["SLF001", "S101", "S311", "D", "ANN"]  # AAA tests: asserts, private access, random data, no docstring/annotation duty
"__init__.py" = ["F401"]                 # re-export modules: naked imports, no `as` alias
"scripts/**" = ["INP001", "S"]   # maintainer tooling, not the shipped library
".github/scripts/**" = ["INP001", "S", "D", "ANN"]   # maintainer tooling, not held to shipped-source style
"notebooks/**" = ["INP001", "S", "D", "ANN", "E501", "PTH", "PLW2901", "B"]  # exploratory notebooks, not held to shipped-source style
# @cache on FunctionSampler's computed-array methods is deliberate; the resulting instance
# retention is tracked as a parked behavior item, not silently refactored here.
"snuffled/_core/analysis/_function_sampler.py" = ["B019"]

[tool.ty.src]
include = ["snuffled"]

[tool.coverage.run]
source = ["snuffled"]
relative_files = true  # so per-combo matrix data files combine without a [paths] map

[tool.coverage.report]
precision = 2
fail_under = 95        # cumulative gate, enforced on the combined matrix data
exclude_also = [
    "@abstractmethod",
    "@abc.abstractmethod",
]

[tool.codespell]
# "didactical" is an intentional (valid) adjective in a package docstring.
# "intoto": the in-toto attestation format (provenance.intoto.jsonl).
ignore-words-list = "didactical,intoto"
# Notebooks embed base64 image outputs that codespell misreads as typos.
skip = "*.ipynb"

[tool.pytest.ini_options]
addopts = "-n auto --dist worksteal --strict-markers"
markers = [
    "only_with_numba_jit: requires numba JIT compilation; auto-skipped when NUMBA_DISABLE_JIT is set (see tests/conftest.py)",
]
