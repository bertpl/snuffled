version: 2
# These settings apply to every entry below:
#   - Each ecosystem runs on its own weekday:
#     - Branch protection requires a PR branch to be up to date with main, so
#       when 2 Dependabot PRs open together, the first one to auto-merge leaves
#       the other behind main until someone updates it by hand.
#     - Dependabot's actual run times drift by hours, so only running each
#       ecosystem on a different day keeps 2 Dependabot PRs from opening
#       together; the 01:00 local time only makes it likely that nothing else
#       is being pushed to main at that moment.
#     - The 2 groups of 1 ecosystem can still open PRs on the same day; the
#       major-bump PR waits for review anyway, so updating it by hand then
#       costs no extra step.
#   - Minor/patch bumps and major bumps go in separate groups:
#     - The auto-merge workflow (.github/workflows/dependabot_automerge.yml)
#       uses each PR's update type to decide whether to merge it without
#       review.
#     - A group that contains even 1 major bump counts as major, so a mixed
#       group would keep every minor and patch bump waiting for review too.
#   - The `chore` commit-message prefix makes the PR title (and thus the squash
#     commit on main) follow the repo's `<type>: <summary>` convention that CI
#     enforces.
updates:
  - package-ecosystem: "github-actions"
    # "/" scans .github/workflows; each composite action under .github/actions
    # needs its own entry for the `uses:` pins inside it to be tracked.
    directories:
      - "/"
      - "/.github/actions/unit_test"
      - "/.github/actions/pre_commit"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "01:00"
      timezone: "Europe/Zurich"
    commit-message:
      prefix: "chore"
    groups:
      actions-minor-patch:  # This group auto-merges once CI passes.
        patterns: ["*"]
        update-types: ["minor", "patch"]
      actions-major:  # This group waits for review.
        patterns: ["*"]
        update-types: ["major"]
    # Dependabot opens a PR only for a release older than the cooldown, so a
    # compromised upstream release has time to be found and withdrawn before
    # auto-merge can merge it. Security updates bypass cooldown regardless.
    cooldown:
      default-days: 14

  - package-ecosystem: "uv"
    # Refreshes uv.lock for the runtime + dev/lint/type tooling the lockfile
    # deliberately pins — those rot without automated updates. lockfile-only:
    # the pyproject floors are hand-tuned per-Python markers (earliest wheel
    # per CPython, keeping lowest-direct legs installable) and must never be
    # rewritten by automation.
    directory: "/"
    versioning-strategy: "lockfile-only"
    schedule:
      interval: "weekly"
      day: "tuesday"
      time: "01:00"
      timezone: "Europe/Zurich"
    commit-message:
      prefix: "chore"
    groups:
      python-minor-patch:  # This group auto-merges once CI passes.
        patterns: ["*"]
        update-types: ["minor", "patch"]
      python-major:  # This group waits for review.
        patterns: ["*"]
        update-types: ["major"]
    # 14 days matches PyPI's window for adding files: a release rejects new
    # files once it is 14 days old, so after waiting that long, the release's
    # set of files is final.
    cooldown:
      default-days: 14

  - package-ecosystem: "pre-commit"
    # Dependabot bumps the `rev:` of each hook that .pre-commit-config.yaml
    # pulls from a remote repo. The hooks under `repo: local` run tools pinned
    # in uv.lock, which the uv entry above updates.
    directory: "/"
    schedule:
      interval: "weekly"
      day: "wednesday"
      time: "01:00"
      timezone: "Europe/Zurich"
    commit-message:
      prefix: "chore"
    groups:
      pre-commit-minor-patch:  # This group auto-merges once CI passes.
        patterns: ["*"]
        update-types: ["minor", "patch"]
      pre-commit-major:  # This group waits for review.
        patterns: ["*"]
        update-types: ["major"]
    # A hook `rev:` is a git tag that the hook's author publishes, so, as for
    # github-actions above, the cooldown gives time for a compromised or broken
    # release to be found and reported before Dependabot proposes it.
    cooldown:
      default-days: 14
