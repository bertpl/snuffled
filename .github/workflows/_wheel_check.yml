# This reusable workflow checks the built wheel:
#   - build the distribution (sdist and wheel) once;
#   - check the wheel statically;
#   - install the wheel into a new virtual environment and run the test suite against the wheel.
#
# Only the wheel is checked. The release also publishes the sdist from the same build,
# and no job checks the sdist.
#
# The check catches packaging errors (a missing subpackage or py.typed file,
# shipped code that imports a dev-only dependency outside the `test` group)
# that the `test` job cannot see, because that job installs snuffled in
# editable mode.
#
# The release pipeline publishes the `dist` artifact that the build job uploads,
# so renaming that artifact breaks the release.
name: Wheel check

on:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: ${{ vars.UV_VERSION }}
          enable-cache: false  # release path: this job's output is published; never restore from a poisonable cache

      - name: Build sdist + wheel
        run: uv build

      # This static check catches structurally broken wheels (empty, missing the
      # declared import package, ...) before the install job starts.
      - name: Check wheel contents
        run: uv run --frozen --no-default-groups --group wheel-check check-wheel-contents dist/*.whl

      - name: Upload distribution artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  install-test:
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: ${{ vars.UV_VERSION }}
          enable-cache: false  # release path: never restore runtime artifacts from a poisonable cache

      - name: Download distribution artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist

      # `wheel-venv` gets its packages from 2 sources:
      #   - the test dependencies, at the versions pinned in uv.lock, from the `test`
      #     group only (`--only-group` leaves out snuffled and its runtime dependencies);
      #   - snuffled and its runtime dependencies, from the built wheel alone, never
      #     from the source checkout.
      - name: Install the built wheel into wheel-venv
        run: |
          uv export --frozen --no-emit-project --only-group test -o requirements.txt
          uv venv wheel-venv
          uv pip install --python wheel-venv/bin/python -r requirements.txt
          WHEEL=(dist/*.whl)
          uv pip install --python wheel-venv/bin/python "snuffled @ file://$PWD/${WHEEL[0]}"

      # The `snuffled/` source directory sits at the repo root, and pytest puts the
      # repo root on sys.path because tests/ is a package. Python would then import
      # that source directory, not the installed wheel, so this step deletes it.
      - name: Remove the source package from the checkout
        run: rm -rf snuffled

      - name: Run the test suite against the installed wheel
        env:
          # tests/conftest.py fails the run unless snuffled is imported from site-packages
          SNUFFLED_TESTS_NEEDS_INSTALLED_WHEEL: "1"
        run: wheel-venv/bin/python -m pytest tests/
