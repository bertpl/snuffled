name: Unit tests (full matrix)

on:
  workflow_call:

permissions:
  contents: read

jobs:
  core:
    name: py${{ matrix.python }} / ${{ matrix.resolution }} / jit-${{ matrix.jit }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # ubuntu-only: the analysers are pure Python + numpy/numba with no OS-specific
        # code paths, so one OS exercises everything. The entries below cover each axis (Python
        # version, dependency resolution, JIT) without running every combination of them:
        #   - every supported Python
        #   - both dependency resolutions (`highest` and `lowest-direct`)
        #   - JIT on and off, at least on the oldest and newest Python
        # The jit-off entries measure coverage; the jit-on entries
        # exercise the compiled paths + JIT-only tests — see tests/conftest.py for why
        # the suite runs in both modes.
        include:
          - { python: "3.12", resolution: highest,       jit: "off" }
          - { python: "3.13", resolution: highest,       jit: "off" }
          - { python: "3.14", resolution: highest,       jit: "off" }
          - { python: "3.15", resolution: highest,       jit: "off" }
          - { python: "3.12", resolution: lowest-direct, jit: "off" }
          - { python: "3.14", resolution: lowest-direct, jit: "off" }
          - { python: "3.15", resolution: lowest-direct, jit: "off" }
          - { python: "3.12", resolution: highest,       jit: "on"  }
          - { python: "3.14", resolution: highest,       jit: "on"  }
          - { python: "3.15", resolution: highest,       jit: "on"  }
          - { python: "3.12", resolution: lowest-direct, jit: "on"  }  # oldest numpy under compilation
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/unit_test
        with:
          uv_version: ${{ vars.UV_VERSION }}
          python_version: ${{ matrix.python }}
          dependency_resolution: ${{ matrix.resolution }}
          # jit drives everything: the jit-off entries disable compilation, carry coverage,
          # and are the ones the coverage job unions + gates.
          jit: ${{ matrix.jit }}

  coverage:
    name: coverage
    # Cumulative gate: combine every combo's data into one picture before checking the
    # floor, so version-/dependency-divergent code paths (only hit on some combos) don't
    # read as uncovered.
    needs: [core]
    # always() so a cancelled/failed combo makes this job FAIL explicitly rather than
    # skip — GitHub doesn't reliably propagate a cancelled leg through needs.
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require every matrix combo to have succeeded
        if: needs.core.result != 'success'
        run: |
          echo "::error::test matrix did not fully succeed (core result: ${{ needs.core.result }})"
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: ${{ vars.UV_VERSION }}
      - name: Download coverage data from all matrix combos
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: coverage-data-*
          merge-multiple: true
      - name: Combine and report (fails below the [tool.coverage.report] floor)
        run: |
          uv run --group dev coverage combine
          uv run --group dev coverage report
      - name: Compute release metrics (coverage % + test count)
        run: uv run --group dev python .github/scripts/ci_compute_metrics.py metrics.json
      - name: Upload release metrics
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-metrics
          path: metrics.json
