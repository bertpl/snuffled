# Reusable package-integrity check: build the distribution once, verify the
# wheel statically, then install it into a bare environment and run the test
# suite against it. Guards the packaging layer (a missing subpackage or
# py.typed, shipped code that imports a dev-only distribution) that the
# editable-install test matrix can never see.
# Called from the PR pipeline (behind ci-gate) and from the release pipeline
# (before publish, which publishes the exact artifact tested here).
name: Package check

on:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: ${{ vars.UV_VERSION }}
          enable-cache: false  # release path: this job's output is published; never restore from a poisonable cache

      - name: Build sdist + wheel
        run: uv build

      # Static check: catches structurally broken wheels (empty, missing the
      # declared import package, ...) before the install job spins up.
      - name: Check wheel contents
        run: uv run --frozen --no-default-groups --group package check-wheel-contents dist/*.whl

      - name: Upload distribution artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  install-test:
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: ${{ vars.UV_VERSION }}
          enable-cache: false  # release path: never restore runtime artifacts from a poisonable cache

      - name: Download distribution artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist

      # Bare environment: the test dependencies come lockfile-pinned from the
      # test group (--only-group keeps the project and its runtime dependencies
      # out), and snuffled comes only from the built wheel, which brings its own
      # runtime dependencies.
      - name: Install the built wheel into a bare environment
        run: |
          uv export --frozen --no-emit-project --only-group test -o requirements.txt
          uv venv blind-venv
          uv pip install --python blind-venv/bin/python -r requirements.txt
          WHEEL=(dist/*.whl)
          uv pip install --python blind-venv/bin/python "snuffled @ file://$PWD/${WHEEL[0]}"

      # snuffled's package sits at the repo root, and pytest puts the repo root
      # on sys.path because tests/ is a package. The checkout's copy would then
      # hide the installed wheel, so it is deleted.
      - name: Remove the source package from the checkout
        run: rm -rf snuffled

      - name: Run the test suite against the installed wheel
        env:
          # tests/conftest.py fails the run unless snuffled is imported from site-packages
          SNUFFLED_TESTS_NEEDS_INSTALLED_WHEEL: "1"
        run: blind-venv/bin/python -m pytest tests/
